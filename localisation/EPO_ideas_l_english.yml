l_english:
 EPO_legacy_of_the_navigator:0 "Legacy of the Navigator"
 EPO_legacy_of_the_navigator_desc:0 "Henry the Navigator was the third son of John I of Portugal. Knowing he would never be King he spent his life promoting exploration and sea craft. This legacy is still with us today."
 EPO_royal_tc:0 "Royal Trading Houses"
 EPO_royal_tc_desc:0 "The Portuguese Crown exercised their full power over colonial ventures since the very beginning of Portuguese nautical exploration. Commercial institutions where so created to overview commercial affairs like the Casa da India, initial called Casa da Guiné e Mina."
 EPO_global_empire:0 "A Global Empire"
 EPO_global_empire_desc:0 "The Portuguese established the first global maritime and commercial empire under the leadership of Henry the Navigator in the 15th century. He sent out key expeditions to Africa and Asia, establishing a foothold accross seas."
 EPO_carracks_black_sword:0 "Carracks Black Sword"
 EPO_carracks_black_sword_desc:0 "The Carracks Black Sword was designed by Portuguese sailors to give an upperhand in close combat. Painted in black they would not reflect light, giving an extra stelthness but also protecting them from sea watter corrosion."
 EPO_quinto:0 "O Quinto"
 EPO_quinto_desc:0 "The Quinto was a tax levied by the Portuguese crown over commercial ventures on overseas provinces. The crown would take a fifth of the produced goods, being more prohemently endorsed over the production of gold in Brazil."
 EPO_carreira_india:0 "Carreira da India"
 EPO_carreira_india_desc:0 "The Carreira da India was the maritime trade route established by the Portuguese, connecting Lisbon to Goa by sailling around the Cape of the Good Hope"
 EPO_holy_orders:0 "The Holy Military Orders"
 EPO_holy_orders_desc:0 "From the very early stages of the Portuguese national upbringing, Holy Military orders known as 'Ordens de Cavalaria' played a crucial role, not only during the reconquista but also later on, in our maritime expansion."