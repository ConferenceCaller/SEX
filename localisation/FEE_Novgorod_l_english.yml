# Tooltips
 fee_nov_famine_tt: "This choice will send your country down a path of disaster, which Muscovy surely will react to."
 fee_nov_vassalization_tt: "This might lead to our vassalization."
 BM_FEE_NOV_subjugation_war_TT: "\nSubjugating §YNovgorod§! in this war will allow us to convert them into a §TIncorporated Vassal§! which is cheaper to integrate and does not cost a diplomatic slot and will grant us their border territories."
 BM_FEE_NOV_subjugation_war_TT2: "\n§YNovgorod§! will grant us their border territories."