 #DUTCH FLAVOUR:
 CM_moreflavour_DUTCH.1.t: "Dutch Factionalism"
 CM_moreflavour_DUTCH.1.d: "The wars of the Hoecks and the Cabbeljaws were a conflict in the Netherlands that lasted from 1350 to the end of the 15th century. There were several civil wars and conflicts, partially about who holds the title of 'Count of Holland', but it was also a big ground of conflict between the more progressive cities and the slowly establishing bourgeois - the Cods or 'Kabbeljauwse' in Dutch on one side, and the more conservative ruling nobility - the Hooks or 'Hoekse' on the other side. \n \nWe should seek to mend the schism between these two factions as soon as possible, for our neighbours have been using this civil war for their own gain and only a united nation can stem itself against this tide."
 CM_moreflavour_DUTCH.1.a: "We shall put an end to this discord."
 CM_moreflavour_DUTCH_TT1: "We can remove the following modifier with the '§YEnd the Factional Strife§! decision."


 CM_moreflavour_DUTCH.2.t: "Flemish Cloth"
 CM_moreflavour_DUTCH.2.d: "The period between the 11th and 13 century was a golden age for Flanders. Thanks to the diligence of its weaver guilds and the entrepreneurship of its merchants, Flemish cloth is renowned for its exceptionally high quality and is in great demand throughout Europe, attracting wealthy Italian and Spanish merchants. With these demands, Flanders has turned its cloth industry into the cornerstone of its economy and been able to bankroll its infrastructure and the expansion of Bruges into the busiest port in northern Europe."
 CM_moreflavour_DUTCH.2.a: "Profits are ensured!"


 CM_moreflavour_DUTCH.3.t: "Favor of the Burgundians"
 CM_moreflavour_DUTCH.3.d: "Wars and flagrant spending has emptied our treasury, and inefficient administration destroyed our income from our prospering cities and fiefdoms. But since the ascension of Philippe 'the good' as Duke of Burgundy, he has taken it upon himself to rebuild the Brabantian duchy's economy from its ashes. Reforming our systems and bureacrautic administrations and creating a truly able governmental apparatus has saved us from our woes. It now stands to order that we use our military experience in the name of the Duke himself, as favoured Duchy of the Lowlands."
 CM_moreflavour_DUTCH.3.a: "To arms! In the name of the Duke!"


 CM_moreflavour_DUTCH.4.t: "Middelburg Canal"
 CM_moreflavour_DUTCH.4.d: "Established in the late medieval period, Middelburg's canal system has served as a vital artery for trade and transportation in the heart of Zeeland. Originating in the 12th century, the canals were strategically designed to facilitate the movement of goods and people, contributing to the economic prosperity of the various fishing towns spanning Zeeland. The waterways played a significant role in connecting Middelburg to the broader network of maritime trade routes that were ongoing in the Netherlands and beyond, enhancin its status as a bustling commercial hub. Over the centuries the canals witnessed urban development and eventually adapting to changing economic landscapes as entire cities formed around the canals."
 CM_moreflavour_DUTCH.4.a: "Quite an engineering marvel!"

