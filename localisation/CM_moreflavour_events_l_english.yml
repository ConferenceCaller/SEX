 #MAMLUKS 
 CM_moreflavour_MAMLUKS.1.t: "Julban Mutiny"
 CM_moreflavour_MAMLUKS.1.d: "During the reign of Sultan Jaqmaq Burji, many of his most trusted colleagues and friends had been promoted to high-ranking posts such as the 'Dawadar Kabir', Grand Executive Secretary, or 'Atabik al-Asakir, Commander-In-Chief. This created an elite that was trusted and reliable on an institutional level, but also caused much unrest within the Mamluk caste who saw it as nepotistic and antithetical to the meritocratic ideals that the Mamluke Sultanate was founded. This outrage eventually formed into the 'Julban', a rebellious band of mamluke soldiers who eventually surrounded the citadel in Cairo, demanding the release of several mamluks who had been dismissed and the immediate resignation of the Commander-In-Chief."
 CM_moreflavour_MAMLUKS.1.a: "Accursed Mutineers!"
 CM_moreflavour_MAMLUKS.1.b: "I suppose we can give in to their demands."


 CM_moreflavour_MAMLUKS.2.t: "Egyptian Soldiers Mutiny"
 CM_moreflavour_MAMLUKS.2.d: "While Mamluks make up the core of our forces, not all of our military consists of warrior slaves. Local Egyptian soldiers are an important addition to our army, often employed as guards and garrisons. \nSmall chances for advancements within the army and low pay aren't the best motivators however, and it is not clear how far we can trust these men. Certainly their training and equipment are often neglected by the Amir in charge of them. \nIn the Delta, the mistrust between the Egyptian and Mamluk Amirs have led to a mutiny."
 CM_moreflavour_MAMLUKS.2.a: "We must crush this in its cradle!"
 CM_moreflavour_MAMLUKS.2.b: "We should improve their situation."


 CM_moreflavour_MAMLUKS.3.t: "Suspicious Mutinies"
 CM_moreflavour_MAMLUKS.3.d: "With the recent rebellions, there are now whispers in the court on who is to blame for these uprisings against the Caliphate. Some point fingers to the Amirs, local nobles who are not part of the institutional-elite of the Mamluks, others points the inner circle of the Caliph, others to the Mamluks themselves. \nWhichever the case, we must act swift to root out these traitors."
 CM_moreflavour_MAMLUKS.3.a: "It must be the Amirs!"
 CM_moreflavour_MAMLUKS.3.b: "My own advisors must be the cause!"
