 #RUSSIAN MINORS
 CM_moreflavour_RUS_minors.1.t: "Boris the Great"
 CM_moreflavour_RUS_minors.1.d: "Since 1425, Boris Aleksandrovich has ruled the Principality of Tver as Grand Duke ever since Ivan Mikhailovich, Boris' father Aleksander Ivanovich and his brother Yuri Aleksandrovich died from the plague. As Grand Duke of Tver Boris has, through cunning diplomacy with both Ryazan and Lithuania, managed to stay relatively independent from Muscovite dominance. Though with the death of King Vytautas in Lithuania and Ryazan growing closer to submission by the Great Horde, Tver will now have to deepen their alliance with Ryazan."
 CM_moreflavour_RUS_minors.1.a: "Send our diplomats to Ryazan!"
 CM_TVER_boris_bear: "Boris 'the Great' of Tver"
 desc_CM_TVER_boris_bear: ""

 CM_moreflavour_RUS_minors.2.t: "Alliance with Tver?"
 CM_moreflavour_RUS_minors.2.d: "Our treaty with Tver has since the death of Vytautas of Lithuania remained aloof. However, it would seem that Boris of Tver wishes to sign a second treaty, establishing an alliance between our Principalities. Not only would this help us ward off the aggressive posturing of the Great Horde, but it will also allow us to get closer to the Muscovite Principality."
 CM_moreflavour_RUS_minors.2.a: "Sign the treaty."
 CM_RUSSIAN_MINORS_TT1: "With the end of the Civil War, both Tver and Ryazan will offer their allegiance to Moscow."

 CM_moreflavour_RUS_minors.3.t: "A Marriage Offer"
 CM_moreflavour_RUS_minors.3.d: "With the dust settling aftet the Civil War, both Tver and Ryazan has come to our court offering their allegiance to Muscovy. Tver has for long enjoyed independence from Muscovite rule and Ryazan fears invasion from the Great Horde. By offering protection to them both we will be closer to uniting the whole of Russia."
 CM_RUSSIAN_MINORS_TT2: "Both §YTver§! and §YRyazan§! will be turned into §TIncorporated Vassals§! which are cheaper to integrate and do not cost a diplomatic relations slot."

 CM_moreflavour_RUS_minors.3.a: "Of course we accept!"
 CM_moreflavour_RUS_minors.3.b: "For some reason, I hate getting free stuff."

