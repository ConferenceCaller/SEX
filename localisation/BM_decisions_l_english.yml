 #DISINHERIT HEIRS / RULERS
 BM_disinherit_heir_title: "'Disinherit Heir'"
 BM_disinherit_heir_desc: "Your current heir has proven to be a complete incompetent buffoon, jeopardizing the stability and secure rule of your future realm. During a grand banquet at your royal estate, you notice your heir standing awfully close to the edge of a staircase."
 BM_disinherit_heir_TT: "A simple push will do...\n"

 BM_disinherit_ruler_title: "'Abdicate Ruler'"
 BM_disinherit_ruler_desc: "Our current ruler has proven to be a complete incompetent buffoon, jeopardizing the stability and secure rule of our future realm. It is best we harshly 'persuade' our ruler that they are unfit and should reserve thesmelves to their country estate to take an extended break from managing our realm."
 BM_disinherit_ruler_TT: "Just make sure they stay there, forever...\n"


 #HESSE MONARCHY 
 BM_modernize_hesse_monarchy_title: "Modernize Hesse"
 BM_modernize_hesse_monarchy_desc: "It is high time that we fully modernize our already quite militarized state. By adopting a government similar to that of the Prussians we can further proffessionalize our armies."


 #CALIPHAL ACTIONS
 BM_permit_taqiyya_title: "£muslim_school_button£ Permit Taqiyya"
 BM_permit_taqiyya_desc: "Taqiyya is the islamic concept that allows for the denial of faith and beliefs in face of persecution. Many of our brethren live under severe persecution. If we are to allow Taqiyya, any efforts to oppress them will be made more difficult."
 BM_permit_taqiyya_caliph_TT: "Every §YMuslim§! province that is not owned by a nation of the §YMuslim§! faith:"
 BM_permit_taqiyya_modifier: "Taqiyya"
 desc_BM_permit_taqiyya_modifier: ""

 BM_promote_our_maddhab_title: "£muslim_school_button£ Promote Our Maddhab"
 BM_promote_our_maddhab_desc: "All Islam denomination can be divided into Religious Schools, all promoting their view on jurispudence. Enacting this fatwa will result in the superiority of the Caliph's religious school in the eyes of everyone."
 BM_promote_our_maddhab_trigger_TT_yes: "§G3§! §Y[Root.Religion.GetName]§! nations with the same §YReligious School§!has at least §G150.0§! opinion of us."
 BM_promote_our_maddhab_TT: "Every §YMuslim§! nation that has the same §YReligious School§! as the §YCaliph§! gains §G+50.0%§! of their §YReligious School§!'s effect, or in the case of §YShafii§!, §G+5.0%§! Trade Efficiency, for §Y20§! years."
 BM_promote_our_maddhab_trigger_TT_no: "£no£ §G3§! §Y[Root.Religion.GetName]§! nations with the same §YReligious School§! has at least §G150.0§! opinion of us."
 BM_promote_our_maddhab_hanafi: "Promoted Maddhab"
 BM_promote_our_maddhab_hanafi: "Promoted Maddhab"
 BM_promote_our_maddhab_hanbali: "Promoted Maddhab"
 BM_promote_our_maddhab_maliki: "Promoted Maddhab"
 BM_promote_our_maddhab_shafii: "Promoted Maddhab"
 BM_promote_our_maddhab_ismaili_school: "Promoted Maddhab"
 BM_promote_our_maddhab_ismaili_jafari: "Promoted Maddhab"
 BM_promote_our_maddhab_ismaili_zaidi: "Promoted Maddhab"

 BM_promote_religious_exchange_title: "£muslim_school_button£ Promote Religious Exchange"
 BM_promote_religious_exchange_desc: "Relations between many Maddhabs can often be quite heated. It does not have to be this way, by allowing the Caliph to promote peaceful exchange between our schools, we can calm their differences."
 BM_promote_religious_exchange_TT: "Every §YMuslim§! nation will no longer be required to have §G150.0§! Opinion and be §YAllied§! to the nation from whom they want to §YInvite Scholar§!."
 BM_promote_religious_exchange_modifier: "Caliphal Diplomacy"
 desc_BM_promote_religious_exchange_modifier: ""

 BM_inspire_religious_fervor_title: "£muslim_school_button£ Inspire Religious Fervor"
 BM_inspire_religious_fervor_desc: "In these uncertain times, a strong base of followers ready to fight the Holy War is of utmost necessity. Let us release a ruling calling all faithful to war for their beliefs!"
 BM_inspire_religious_fervor_TT: "Gain §G+100§!£icon_manpower£ for every §Y[Root.Religion.GetName]§! province that is owned by a nation of §Y[Root.Religion.GetName]§! religion. \n \nEvery country of §Y[Root.Religion.GetName]§! religion:"
 BM_inspire_religious_fervor_modifier: "Religious Fervor"
 desc_BM_inspire_religious_fervor_modifier: ""

 BM_permit_sufi_teachings_title: "£muslim_school_button£ Permit Sufi Teachings"
 BM_permit_sufi_teachings_desc: "Many jurists tend to disregard the influence of the Sufis, considering their mystical traditions heretical and their lodges deserving of scolding. The Caliph could stand in defence of these belifs."
 BM_permit_sufi_teachings_TT: "Every country of §Y[Root.Religion.GetName]§! religion will have '§YClerical Education§!' also give §G-10.0%§! Advisor Cost and §G-0.1%§! Piety"
 BM_permit_sufi_teachings_modifier: "Permit Sufi Teachings"
 desc_BM_permit_sufi_teachings_modifier: ""

 BM_relax_sharia_title: "£muslim_school_button£ Relax Sharia"
 BM_relax_sharia_desc: "Sometimes the Sharia law tends to be too harsh, especially for the Dhimmi living in our realm. Let us tone down the strict requirements it places on everyone."
 BM_relax_sharia_TT: "Every country of §Y[Root.Religion.GetName]§! religion will gain:"
 BM_relax_sharia_TT2: "Up to §Y3§! random owned provinces of §YHeathen§! faith will gain §G+1§! Base Production and §G+1§! Base Tax"
 BM_relax_sharia_modifier: "Relaxed Sharia"
 desc_BM_relax_sharia_modifier: ""

 BM_endorse_literature_title: "£muslim_school_button£ Endorse Literature"
 BM_endorse_literature_desc: "One of the most glorious ways of praising God is simply through creation. Creation of literacy, works of art and architecture that showcase the beautiful world that we have been gifted."
 BM_endorse_literature_TT: "Every country of §Y[Root.Religion.GetName]§! religion will gain:"
 BM_endorse_literature_modifier: "Endorse Literature"
 desc_BM_endorse_literature_modifier: ""

 BM_selected_caliphal_action_TT: "Has not selected a £muslim_school_button£ §YFatwa§! in the last §Y15§! Years."





