l_english:
 #Flavour events
 epo_flav.1.t:0 "The Battle of Diu"
 epo_flav.1.d:0 "After the death of his son at the Battle of Chaul, the Viceroy Dom Francisco de Alemida set course to avenge his son death. In February 3rd of 1509 near the coast of Diu, the Portuguese Indian Armada met a grand navy formed by Mamluk and Gujarati sailors. Against overwhelming odds the Viceroy Dom Francisco de Almeida managed to not only avenge his sons death but also completely destroy the enemy fleet, asserting Portuguese rule on the Indian Ocean."
 epo_flav.1.a:0 "It is time for Dom Francisco de Almeida back down."
 epo_flav.1.b:0 "This tremendous victory has earned him his continuity as Viceroy."
 epo_flav.2.t:0 "The Negotiations with the Zamorin"
 epo_flav.2.d:0 "As the Portuguese reached India, the Zamorin's, knowledgable in the arts of trade, were not overwelmed by the gifts that the Portuguese used to buy their way around the African coast. Should our envoys make better promisses of gold or bring them down with iron!"
 epo_flav.2.a:0 "Fill them with iron!"
 epo_flav.2.b:0 "We will show the Zamorin's how rich we are."
 epo_flav.2.c:0 "Let's seize what we can."
 epo_flav.3.t:0 "Gifts to the Pope"
 epo_flav.3.d:0 "In 1513 an embassy departed from Portugal in order to renew the allegiance to the pope and present the richness of the vast maritime empire established by the Portuguese. The excursion was a success, quickly conveying all over the other European kingdoms, the might and grandeur of the Portuguese Maritime Empire. Tales told over time mentioned that so much gold and gifts were given to Romans, that any Portuguese traveler passing through the city would be given free food and quarter."
 epo_flav.3.a:0 "Amazing!"
 epo_flav.4.t:0 "Vista Alegre is Founded"
 epo_flav.4.d:0 "In 1815, inspired by the knowledge brought by farway lands of the Portuguese Empire, Pinto Bastos started his own chemical process into making porcelains. The first steps into founding the great... VISTA ALEGRE."
 epo_flav.4.a:0 "Give me some pretty plates!"
 epo_flav.5.t:0 "O Estado da Índia"
 epo_flav.5.d:0 "We need to efficiently oversee and administer Portuguese interests and possessions in India and Africa. It has been suggested that the best way to achieve this is to create an institution directly under the Royal Treasurer with monopoly rights to all related trade connections and goods."
 epo_flav.5.a:0 "This situation suits us well as it is."
 epo_flav.5.b:0 "Sounds like a good idea!"
 epo_flav.6.t:0 "A Shadow Empire"
 epo_flav.6.d:0 "The successful establishment of Portuguese trade posts along the coast of the Indian subcontinent has brought many riches to our Crown and also recognition in the neighbouring realms. With the conquest of important cities like Diu and Goa and our victories against the Muslim powers, some minor kingdoms have come now to us seeking protection from the Ottoman galloping through the Levant. \n The ruler of the city of Aden seeking protection from this threat and to maintain the relevance of his city to the Red Sea trade, has come to us offering the Keys to the city."
 epo_flav.6.a:0 "And we accept it gladly."
 epo_flav6_tooltip:0 "The Government Mechanic '§YShadow Empire§!' will be unlocked. Maintain a stable Empire while keeping the balance between the development of your homeland provinces and those overseas to avoid its collapse."
 epo_flav.7.t:0	"A Monastery in Distress"
 epo_flav.7.d:0 "The lands belonging to the Order of Saint Jerome have been struck with terrible damage and were left in rumbles. However, our consort has come forth with a proposal for a summer palace in this lands. Do we have the funds to spare for such experiments?"
 epo_flav.7.a:0 "We should buy those lands."
 epo_flav.7.b:0 "We cannot afford such things right now."
 epo_flav.8.t:0	"A New Feitoria is Built"
 epo_flav.8.d:0 "Our network of overseas factories grows, asserting our dominance in the region."
 epo_flav.8.a:0 "Good!"
 epo_flav.9.t:0 "Neves Corvo Copper Mines"
 epo_flav.9.d:0 "Since antiquity, the exploration of the Iberian Pyrite Belt has been registered, with several provinces in the south of Portugal measuring important mining centers, during Roman times. Now, with the increasing need for copper to feed cannons to our armies and navies, is it time to reinvest in this mines?"
 epo_flav.9.a:0 "Let's invest in it."
 epo_flav.9.b:0 "We should buy it elsewhere instead."
 epo_flav.10.t:0 "Trading with Japan"
 epo_flav.10.d:0 "Between all the riches in the world, nothing amazed the Japanese warlords as much as western gunpowder weapons, brought by the Portuguese traders. Could this be a profitable oportunity to get into niponic trade?"
 epo_flav.10.a:0 "Trade is the base for diplomacy."
 epo_flav.10.b:0 "It is to dangerous to share with them."
 epo_flav.11.t:0 "Sugar from Madeira"
 epo_flav.11.d:0 "In the XV century Infante Dom Henrique ordered the plantation of sugar cane in the Madeira island in order to revamp the islands economic importance. Those investments have brought now great profit, making the Madeira island a must stop for the Genovese and Flemish traders."
 epo_flav.11.a:0 "Great!"
 epo_flav.12.t:0 "Pestilence in the Sugar Canes"
 epo_flav.12.d:0 "Pestilence has affected our sugar plantations in Madeira. Production and trade have cut short dramatic also due to the increase of sugar plantation in our overseas colonies."
 epo_flav.12.a:0 "Let's refocus on the trade relevance of the island."
 epo_flav.12.b:0 "The island will serve our internal interests."
 epo_flav.13.t:0 "Feitoria Destroyed"
 epo_flav.13.d:0 "It seems that a feitoria in these lands is no longer profitable."
 epo_flav.13.a:0 "That is a shame."
 epo_flav.14.t:0 "Feitoria of Antwerp goes Bankrupt"
 epo_flav.14.d:0 "Our Feitoria on Antwerp has been facing more and more constraints due to the increase of Dutch competition. Is it in the interest of the crown to save it from ruin?"
 epo_flav.14.a:0 "The Crown will buy it!"
 epo_flav.14.b:0 "Do we need it?"
 epo_flav.14.c:0 "We will invest in our economy instead."
 epo_flav.15.t:0 "The National Palace of Pena"
 epo_flav.15.d:0 "In 1755 Lisbon was struck by a huge earthquake followed by a tsunami, that washed the city into the Ocean who once gave the riches who made it what she was. The Royal Palace da Ribeira was tourn down and now the Royal Family and court lies on a improvised woden structured called the Royal Shack. This situation does not suit such explenderous King and Country no more."
 epo_flav.15.a:0 "Let's build the most glorious palace!"
 epo_flav.16.t:0 "Annoyed Scholars"
 epo_flav.16.d:0 "For many centuries the most prestigious place for learning in our Kingdom has raised much debate. Originally settled in Lisbon, it moved back and forth from Lisbon to Coimbra, in 1308 and 1338, 1354 and 1377. It has come time to settle this issue."
 epo_flav.16.a:0 "Let´s build a new campus in Coimbra."
 epo_flav.16.b:0 "Let´s Keep it in Lisbon, under our close supervision."
 epo_flav.17.t:0 "The Antwerpen Factory"
 epo_flav.17.d:0 "With the decline of the port of Bruges Duke of Burgundy is sponsoring the other realms to move commercial operations into the city of Antwerp. The importance of the European markets into selling the goods we bring from our colonies is tremendous! Should we invest in building a factory here, in order to protect our commercial ineterests?"
 epo_flav.17.a:0 "Let's build it!"
 epo_flav.17.b:0 "If you want it, come and get it."
 epo_flav.18.t:0 "Missions of The New World"
 epo_flav.18.d:0 "For years now, the arduous task of settling deep into the jungles of South America has been taken by these adventurous groups of men, called Bandeirantes. They strive deep into the jungle in search of richness within these lands, however, along the way they have been capturing and enslaving indigenous tribes without any regard for God's law. The well-positioned Jesuits have come to us denouncing these practices while the Bandeirantes claim that more resources are needed to avoid such a situation. Should we sponsor the Jesuit's endeavours to evangelize these people or give the appropriate resources to the Bandeirantes?"
 epo_flav.18.a:0 "Let the Jesuits bring faith to them!"
 epo_flav.18.b:0 "There is no hope of civilizing these people!"
 epo_flav.18.c:0 "We have little care of what happens in these lands."
 epo_flav.18.c:0 "You should learn how to work together."
 epo_flav.19.t:0 "An Emissary from Across the Seas"
 epo_flav.19.d:0 "The aggressive nature of the Taifas across the seas, fighting to establish themselves as the Muslim rulers of North Africa, has slowly led them out of grace. Baffled by the gallopant growth of the Christian Kingdoms in Iberia, our foe accross the straigh comes now to us, not seeking conflict but friendship. Afterall, it seems we are the ones following the one true faith."
 epo_flav.19.a:0 "Why can't we be friends?"
 epo_flav.19.b:0 "We will show them our peaceful ways by force"
 epo_flav.19.c:0 "We have no interest in those lands" 
 epo_flav.20.t:0 "Paine pour joie"
 epo_flav.20.d:0 "In 1463, the kingdom of Aragon found itself in civil war against its king John II. The rebel armies belonging to the Catalan institutions of Generalitat and Consell de Cent, offered D. Pedro of Portugal the command of their forces, proclaiming him Count of Barcelona and even calling him King of Aragon. D. Pedro was the son of the Infante Dom Pedro, the Duke of Coimbra, who sat as regent of the Portuguese throne until 1448 when Dom Afonso V came of age."
 epo_flav.20.a:0 "Let's unite our crowns!"
 epo_flav.21.t:0 "The Voyages of Bartolomeu Dias"
 epo_flav.21.d:0 "After conquering the Cape of Storms and baptizing it instead as the Cape of Good Hope, Bartolomeu Dias returned back to Lisbon with broader knowledge of our ships and their performance in the open seas, making it clear that the Latin Caravel had some difficiencies. Althought frustrated for not being able to reach India, he offered his services to reform our navy and improve our ships, developing the Square-rigged Caravel and overseing the construciton of the armada that would reach India under the command of Vasco da Gama."
 epo_flav.21.a:0 "Let's build that Armada!"
 epo_flav.22.t:0 "Dukes of Iberia"
 epo_flav.22.d:0 "Through war and cunning diplomatic works we tried to forge important alliances in order to help us conquer Iberia under the rightful Portuguese crown. However, most recent setbacks have brought us to a stalemate and now, once our allied dukes, have broken their vows and declared independence, giving birth to a broken Iberia. Who has now the power to claim back Iberia and unite under one crown?"
 epo_flav.22.a:0 "Such a shame!"
 epo_flav.23.t:0 "The Promissed Child"
 epo_flav.23.d:0 "In 1498 at Zaragoza, a son was born from the marriage between the Portuguese King Manuel I and Isabella of Aragon. Nicknamed Miguel da Paz this child was the grandson of the Catholic Kings and with the premature death of their heir, Dom Miguel was sworn heir to the crown of Aragon, Castille and Portugal at his birth. However, the newborn heir ended up dying at only 1 year of age, many suggested by internal plot at the castillian court who did not wish to have iberia united under Portuguese rule."
 epo_flav.23.a:0 "He shall bring peace to all Iberia!"
 epo_flav.23.b:0 "He shall bring peace to all Iberia!"
 epo_flav.23.c:0 "He shall bring peace to all Iberia!"
 epo_flav.23.d:0 "He can never be king."
 epo_flav.24.t:0 "The Promissed Child"
 epo_flav.24.d:0 "In 1498 at Zaragoza, a son was born from the marriage between the Portuguese King Manuel I and Isabella of Aragon. Nicknamed Miguel da Paz this child was the grandson of the Catholic Kings and with the premature death of their heir, Dom Miguel was sworn heir to the crown of Aragon, Castille and Portugal at his birth. However, the newborn heir ended up dying at only 1 year of age, many suggested by internal plot at the castillian court who did not wish to have iberia united under Portuguese rule."
 epo_flav.24.a:0 "He is a threat to our Kingdom."
 epo_flav.24.b:0 "He is a threat to our Kingdom."
 epo_flav.24.c:0 "Iberia shall be united as one."
 epo_flav.25.t:0 "World's Silk Capital"
 epo_flav.25.d:0 "In the 18th century, Robert Godin came to Lisbon with plans to invest in the local manufacturing. Godin plans were to make Lisbon the major producer of fine clothing in silk. He open then the Fábrica das Sedas, which operated until 1835, being sold then due to the Napoleonic invasions and the courts moving to Brazil."
 epo_flav.25.a:0 "Make it the fanciest ever!"
 epo_flav.25.b:0 "We should produce according to the people's need."
 epo_flav.26.t:0 "Brazilian Economic Cycles"
 epo_flav.26.d:0 "With the establishment of Capitanships in Brazil, the newly arrived colonials start to organize their economic endeavours based on what the land was bale to give, but also the needs from European markets. With an ever growing economy, boosted by slave labour from Africa, Brazil had multiple Cycles where investment towards the production of a particular good was noticeable. This brough huge benefits for Portuguese crown, who started to grow more and more dependent of its holdings in Brazil, in detriment of the lands far east, that were being stolen by protestant rulers."
 epo_flav.26.a:0 "Focus in mining Gold"
 epo_flav.26.b:0 "Focus in milling Pau Brazil"
 epo_flav.26.c:0 "Focus in planting Sugar"
 epo_flav.26.e:0 "Focus in raising Cattle"

 #Disaster Events
 portugal_sucession_crisis.1.t:0 "The Portuguese Sucession Crisis"
 portugal_sucession_crisis.1.d:0 "In August 4th 1578, the Portuguese King along with a great number of the most prominent Portuguese nobility, met the Moorish forces at Alcácer Quibir. The battle ended in a disastrous defeat where both the King and most of the nobles where either capture or killed in battle. Following this events a crisis erupted in Portugal, as there was no clear sucession to the throne while the Castillian Habsburgs held direct claim to it."
 portugal_sucession_crisis.1.a:0 "Dire times ahead."
 portugal_sucession_crisis.2.t:0 "Tough Decisions"
 portugal_sucession_crisis.2.d:0 "The nobles conveyed and must now decide what fate the Portuguese crown shall take."
 portugal_sucession_crisis.2.a:0 "The union of the Iberian crowns is inevitable."
 portugal_sucession_crisis.2.b:0 "We must preserve our independence!"
 portugal_sucession_crisis.3.t:0 "[loyal_province.GetName] Declares Support"
 portugal_sucession_crisis.3.d:0 "The count of [loyal_province.GetName] declares full support to the Cardeal decision on who should rule our kingdom."
 portugal_sucession_crisis.3.a:0 "Good!"
 portugal_sucession_crisis.4.t:0 "[disloyal_province.GetName] Declares for Dom António"
 portugal_sucession_crisis.4.d:0 "The count of [disloyal_province.GetName] has rallied under Dom António's claim to the throne."
 portugal_sucession_crisis.4.a:0 "I see..."
 portugal_sucession_crisis.5.t:0 "[disloyal_province.GetName] Betrays us!"
 portugal_sucession_crisis.5.d:0 "The count of [disloyal_province.GetName] has been deluded by our Castilian neighbours."
 portugal_sucession_crisis.5.a:0 "Such a mistake!"
 portugal_sucession_crisis.6.t:0 "[disloyal_province.GetName] Declares for Dona Catarina"
 portugal_sucession_crisis.6.d:0 "The count of [disloyal_province.GetName] has rallied under Dona Catarina's claim to the throne."
 portugal_sucession_crisis.6.a:0 "I see..."
 portugal_sucession_crisis.7.t:0 "More Castilian Rebels!"
 portugal_sucession_crisis.7.d:0 "The troops of the count of [rebel_province.GetName] raised arms in aid to the Castilians."
 portugal_sucession_crisis.7.a:0 "Outrageous!"
 portugal_sucession_crisis.8.t:0 "More Supporters rally to the Avis dynasty!"
 portugal_sucession_crisis.8.d:0 "The count of [rebel_province.GetName] has raised his troops in aid of Dom António."
 portugal_sucession_crisis.8.a:0 "The Bastards!"
 portugal_sucession_crisis.9.t:0 "More Legitimists rally to the Duchess!"
 portugal_sucession_crisis.9.d:0 "The count of [rebel_province.GetName] has rallied under the Bragança banner."
 portugal_sucession_crisis.9.a:0 "Dam them!"
 portugal_sucession_crisis.10.t:0 "The Portuguese Sucession Crisis"
 portugal_sucession_crisis.10.d:0 "In August 4th 1578, the Portuguese King along with a great number of the most prominent Portuguese nobility, met the Moorish forces at Alcácer Quibir. The battle ended in a disastrous defeat where both the King and most of the nobles where either capture or killed in battle. Following this events a crisis erupted in Portugal, the Portuguese ask now for our support."
 portugal_sucession_crisis.10.a:0 "We gladly accept the Portuguese crown."
 portugal_sucession_crisis.10.b:0 "We will give the Crown to the most worthy Infante."
 portugal_sucession_crisis.11.t:0 "The Portuguese King is dead!"
 portugal_sucession_crisis.11.d:0 "Our Portuguese friends have found their throne empty and without any apparently legitimate heir. The most noble and direct line of succesion comes back to us. Should we help them establish a new dynasty or force our rightfull claims to the Portuguese throne?"
 portugal_sucession_crisis.11.a:0 "The throne belongs to us!"
 portugal_sucession_crisis.11.b:0 "We should not intervene." 
 portugal_sucession_crisis.12.t:0 "Portuguese Sucession Crisis"
 portugal_sucession_crisis.12.d:0 "As the Portuguese nobles split between those who would welcome the Spanish Habsburgs to the Portuguese throne and those who would fight to death for Portuguese independence forces muster around those the most suitted pretender."
 portugal_sucession_crisis.12.a:0 "We shall rally to Dom António de Avis!"
 portugal_sucession_crisis.12.b:0 "We shall rally to Dona Catarina de Bragança!" 
 portugal_sucession_crisis.13.t:0 "A suitable Pretender?"
 portugal_sucession_crisis.13.d:0 "Our Castilian friends have presented one of their Infants to inherit the Portuguese throne."
 portugal_sucession_crisis.13.a:0 "We accept their offer."
 portugal_sucession_crisis.13.b:0 "This is an insult!"
 portugal_sucession_crisis.14.t:0 "The Portuguese Sucession Wars Starts"
 portugal_sucession_crisis.14.d:0 "After much deliberation, a consensus wasn't set on who should lead the Portuguese throne. It is time now to assure the best match by force of arms!"
 portugal_sucession_crisis.14.a:0 "So it begins..."
 portugal_sucession_crisis.15.t:0 "A New Beginning!"
 portugal_sucession_crisis.15.d:0 "After years of tumultuous rule over our Kingdom, a victor has emerged through wit and sword to rule our kingdom. It is time to have peace among our people."
 portugal_sucession_crisis.15.a:0 "It is time to mend our wounds."
 por_civil_war.1.t:0 "Cortes Gerais e Extraordinárias da Nação Portuguesa"
 por_civil_war.1.d:0 "In 1821, after the Liberal Revolution in Porto, the most prominent people of the Portuguese Empire gathered in Lisbon in order to establish a Portuguese parliament and promote a more liberal rule of over the empire. Serious matters where in discussion, specially due to the rising importance of our colony, Brazil, and the impact of the Napoleonic Invasions."
 por_civil_war.1.a:0 "Dire times ahead."
 por_civil_war.2.t:0 "Political Choices"
 por_civil_war.2.d:0 "After the General Cortes assembled the division of opinions inside our realm is clear. We must now, as the King decide if you want to follow the liberals and maintain our empire together or protect the old established chains of power and risk civil war."
 por_civil_war.2.a:0 "The power of the King is absolute!"
 por_civil_war.2.b:0 "The Empire must endure!"
 por_civil_war.3.t:0 "A Constitution"
 por_civil_war.3.d:0 "On the way to a more liberal form of government, the Cortes Gerais brought forward a draft of a constitution, a lot similar to the Constitution of Cádiz. In these treaty it should be clearly set the rights and freedoms of the Portuguese people all over the empire and also, the power and role to expect from the King."
 por_civil_war.3.a:0 "Fine I will sign that paper."
 por_civil_war.3.b:0 "This is outrageous!"
 por_civil_war.4.t:0 "The Absolutists Revolt"
 por_civil_war.4.d:0 "Unhappy with the current reforms that have curtailed the powers of the nobility, the signing of the New Constitution has made a group of nobles to rally under the King's brother, Dom Miguel."
 por_civil_war.4.a:0 "They are traitors!"
 por_civil_war.5.t:0 "Civil War Ended"
 por_civil_war.5.d:0 "Too much Portuguese blood has been shed during this Civil War, it is time now to all under our mighty nation come together and rebuild and heal."
 por_civil_war.5.a:0 "Good!"
 por_civil_war.6.t:0 "Brazilian Question"
 por_civil_war.6.d:0 "The quick rise on the economic relevance of our lands in Brazil shadows the rest of our empire. Ideas of independence are now openly spoken. What was once a part of us, comes with a request for Indepence, what should we do?"
 por_civil_war.6.a:0 "Grant them indepencence."
 por_civil_war.6.b:0 "Crush the traitors!"
 por_civil_war.7.t:0 "The Absolutists Revolt"
 por_civil_war.7.d:0 "Unhappy with the continuously intransigent state of affairs, the people of our realm have rallied around some of the most prominent burgers and took up arms in revolt."
 por_civil_war.7.a:0 "Crush them!"
 por_civil_war.8.t:0 "Portuguese Liberal Monarchy"
 por_civil_war.8.d:0 "After many rebels suppressed and war fought the King and the realm as came together under one divided in law but together as a nation, a more just and free nation."
 por_civil_war.8.a:0 "Time to heal!"
 por_civil_war.9.t:0 "Portuguese Absolut Monarchy "
 por_civil_war.9.d:0 "After many rebels suppressed and war fought the country as come together under our King and his divine right to rule!"
 por_civil_war.9.a:0 "Long Live the King!"
 por_civil_war.10.t:0 "Internal Problems"
 por_civil_war.10.d:0 "Our rulers have grown detached and uncensored, far away from our problems. We need to be proper recognized regarding your relevance in the empire and not just a subject nation."
 por_civil_war.10.a:0 "It is time to declare our independence!"
 por_civil_war.10.b:0 "We hsould stick together."
 por_civil_war.11.t:0 "Dismiss Clergical Administrators"
 por_civil_war.11.d:0 "In order to reform our country we have to remove from office corrupt clerical administrators that have planned and controlled important positions fo decisions."
 por_civil_war.11.a:0 "Enact the needed reforms."
 por_civil_war.11.b:0 "This is persecution."
 por_civil_war.12.t:0 "Dismiss Noble Administrators"
 por_civil_war.12.d:0 "In order to reform our country we have to remove from office corrupt noble administrators that have planned and controlled important positions fo decisions."
 por_civil_war.12.a:0 "Enact the needed reforms."
 por_civil_war.12.b:0 "This is persecution."
 por_civil_war.13.t:0 "Dismiss Burghers Administrators"
 por_civil_war.13.d:0 "In order to reform our country we have to remove from office corrupt burghers administrators that have planned and controlled important positions fo decisions."
 por_civil_war.13.a:0 "Enact the needed reforms."
 por_civil_war.13.b:0 "This is persecution."
 por_civil_war.14.t:0 "Promote Burgher Administrators"
 por_civil_war.14.d:0 "Our Burgher estates have came with a petition in order to promote a more meritocratic administration of our realm."
 por_civil_war.14.a:0 "It is a most worthy petition."
 por_civil_war.14.b:0 "We cannot fulfill this."
 por_civil_war.15.t:0 "Promote Noble Administrators"
 por_civil_war.15.d:0 "Our Nobles have came forth with a petition to defend a more trustworthy and able group of men to administer over our country's affairs."
 por_civil_war.15.a:0 "It is a most worthy petition."
 por_civil_war.15.b:0 "We cannot fulfill this."
 por_civil_war.16.t:0 "Promote Clergical Administrators"
 por_civil_war.16.d:0 "Our clerical estates have came together with a set of rules and rirectives in order to make our adminsitratioj n more efficient. Of course this task wold set uppon them but it may bring profits to our realm."
 por_civil_war.16.a:0 "It is a most worthy petition."
 por_civil_war.16.b:0 "We cannot fulfill this."
 #Event chains
 epo_chain.1.t:0 "The Search for Prester John"
 epo_chain.1.d:0 "For long the tales of a Christian nation far to the east have enticed the fantasies of European countries. Now it is time for us to catch these dreams and reestablish a connection with this long lost brothers in faith!"
 epo_chain.1.a:0 "Let's send Frei António de Lisboa and Pedro Monte Arroio."
 epo_chain.1.b:0 "We shouldn't waste time on fairy tales."
 epo_chain.2.t:0 "A waste of time?"
 epo_chain.2.d:0 "Our explorers, António Frei de Lisboa and Pedro Monte Arroio managed to travel as far as Jerusalém, however quickly realised that without any knowledge in Arabic or resources to arrange translaters they had to return back home, empty handed."
 epo_chain.2.a:0 "We will send Pêro de Covilhã and Afonso de Paiva instead!"
 epo_chain.2.b:0 "I guess that is it."
 epo_chain.3.t:0 "Afonso de Paiva is dead!"
 epo_chain.3.d:0 "As the two explorers splitted, P~êro de Covilhã to set sail to the Indian continent and Afonso de Paiva towards the Ethiopian Region, the later fell hill to a pestilence and died before both could meet again, leaving the Kingdom of Prester John still a mystery."
 epo_chain.3.a:0 "He has done is part, he can come back home."
 epo_chain.3.b:0 "He will set to find the long lost kingdom!"
 epo_chain.4.t:0 "The Ethiopians"
 epo_chain.4.d:0 "After the ill news of Afonso de Paiva death, Pêro de Covilhã set course towards the Ethiopian lands in search for the rich and powerful Kingdom of Prester John. However the people he met where most likely in need of more help that they could offer."
 epo_chain.4.a:0 "They are the promised kingdom!"
 epo_chain.4.b:0 "Quite Unimpressive."
 epo_chain.5.t:0 "The Brazilian Gold"
 epo_chain.5.d:0 "With the fallout of the importance of our states in India, the reliance on the riches from Brazil was significantly increased. The finding of vast amounts of gold solved our financial problems but our economy is still weak specially compared with our European conterparts."
 epo_chain.5.a:0 "We are rich!"
 epo_chain.5.b:0 "We should reform our country!"
 epo_chain.5.c:0 "We should invest in the navy!"
 epo_chain.5.e:0 "We should invest in the army!"
 epo_chain.6.t:0 "Over Reliance on Brazil"
 epo_chain.6.d:0 "With more and more gold coming from Brazil, more and more people move to the New World to profit from the riches found there. This influx of wealth is filling your coffers but our home country is falling behind."
 epo_chain.6.a:0 "The situation is fine as it is."
 epo_chain.6.b:0 "We need to make amends."
 epo_chain.7.t:0 "Sub-Saharan Trade"
 epo_chain.7.d:0 "Our master navigators have opened route through the Cape of Bojador, reaching the tales of richness that lie behind it. With the guidance of the Infante Dom Henrique, a plan as set to divert the Saharan trade through the North East. For that, a impressive fort was built in Arguim in order to storage trade goods and give proper maintenance and protection to our trading ships."
 epo_chain.7.a:0 "Let's negotiate with them."
 epo_chain.7.b:0 "It's not worth it."
 epo_chain.8.t:0 "Island of Cabo Verde"
 epo_chain.8.d:0 "The winds pulling our caravels west of the African shore had lead us towards sets of islands not far from the continental coast. Due to the difculties to sail againts wind our navigators suggest to use this currents, abandoding the previously safer choice of sailling along coast wihtout losing them from sight. Who knows this might lead us to discover new, uncharted lands."
 epo_chain.8.a:0 "Let's follow nature's call."
 epo_chain.8.b:0 "Crazy idea, stay near shore!"

 epo_chain.9.t:0 "A Fallen Empire"
 epo_chain.9.d:0 "After building a feitoria in Arguim our traders faced extra difficulties with establishing trade partnerships in the Sub-Sharan region. After the downfall of the Mali Empire, multiple kingdoms arrose just to fell as quickly, due to the bellic nature of the local diplomatic relations. It is up to us now, to find a way to have a reliable trade partner which can lead us to the so sought after gold."
 epo_chain.9.a:0 "Send our diplomats to establish connections with these kingdoms."
 epo_chain.9.b:0 "Let the merchants find a solution themselves."

 epo_chain.10.t:0 "In Search for Gold"
 epo_chain.10.d:0 "The complex politics that embroiled the Sub-Saharan region, brought increasing difficulties to establish trade connections with the splitted kingdoms of the former Mali Empire. These tumultuous kingdoms have fed an economy of gold and war between each other, which also bread a slave economy. These goods would then be traded by Portuguese traders, who would negotiate at Arguim, in the North, with some of these kingdoms and in the South, at the Cape, with those who rival them."
 epo_chain.10.a:0 "Send Diogo the Azambuja to build a feitoria in the cape."
 epo_chain.10.b:0 "Set our focus on India instead."
 epo_chain.10.tt:1 "All owned provinces in §YSub-Saharan Africa§! will now produce §YSlaves§!, the §YGold Coast§! will produce §YGold§!. The construction of the fort §YSão Jorge da Mina§! will start in the §YGold Coast§!."


 epo_chain.11.t:0 "Sugar Islands"
 epo_chain.11.d:0 "In 1471 João de Santarém and Pêro Escobar have discovered multiple islands over the Benin Golf. Inhabited but with great conditions for settling plantations, its was introduced the production of Sugar and to a lesser extened cacau in the Islands of São Tomé and Príncipe."
 epo_chain.11.a:0 "We will produce sugar in São Tomé"
 epo_chain.11.b:0 "Why bother?"


 epo_chain.12.t:0 "Luís de Camões"
 epo_chain.12.d:0 "Luís Vaz de Camões was born in Lisboa and raised in Coimbra, where he studied history, cosmography and classic and modern literature. At twenty years of age he moved to Lisbon, before completing his studies. His family was poor, but being noble, he could be admitted to the court of [Root.Monarch.GetName] where he established fruitful intellectual contacts and began his career as a poet."
 epo_chain.12.a:0 "As armas e os barões assinalados"
 epo_chain.13.t:0 "A Bohemian Lifestyle"
 epo_chain.13.d:0 "Camões adopted a bohemian lifestyle, frequenting taverns and getting involved in tumultuous love affairs. There was talk of a passion for the sister of the [Root.Monarch.GetTitle], but that audacity would have earned him time in prison. Another was Catarina de Ataíde, with whom he allegedly had a frustrated love affair that resulted in his self-exile, first in Ribatejo, and then by enlisting as a soldier in Ceuta. It was here that he was stroke in his right eye in a naval battle at the Straits of Gibraltar."
 epo_chain.13.a:0 "Que, da Ocidental praia Lusitana,"
 epo_chain.14.t:0 "The Borges Incident"
 epo_chain.14.d:0 "In a Corpus Christi procession, Camões got into an altercation with a certain Gonçalo Borges, employee of the Royal Palace, and wounded him with a sword. Sentenced to prison, he later received a letter of pardon and was released by royal order, which says: "he is a young man and poor and he is going to serve in India this year". His last words before leaving, he says in a letter, were those of Scipio Africanus, “Ingrata patria, non possidebis ossa mea” (Ungrateful fatherland, you will not possess my bones)."
 epo_chain.14.a:0 "Por mares nunca de antes navegados"
 epo_chain.15.t:0 "Journey to the East"
 epo_chain.15.d:0 "During the trip, Camões started writing his epic work, seeing this journey as an opportunity to experience what sailors of past and present went through. He passed through the regions where Vasco da Gama had sailed, faced a storm in the Cape of Good Hope where the three other ships in the fleet were lost, and landed in Goa. Soon he enlisted in the service of the viceroy and was sent to fight the Moors in the Red Sea, wintering in Ormuz."
 epo_chain.15.a:0 "Passaram ainda além da Taprobana,"
 epo_chain.16.t:0 "The Cave in Macau"
 epo_chain.16.d:0 "When Camões returned to Goa, an anonymous satire criticizing the prevalence of immorality and corruption was attributed to him. Since satires were condemned by the Ordinances of [Root.Monarch.GetTitle] [Root.Monarch.GetName], Camões was arrested for that. After months in prison, he was released and appointed to the position of Superintendent for the Dead and Missing in Macau. There, he spent some time in a solitude, cave writing his masterpiece."
 epo_chain.16.a:0 "Em perigos e guerras esforçados,"
 epo_chain.17.t:0 "Shipwrecked"
 epo_chain.17.d:0 "On the trip back to Goa, Camões was shipwrecked near the mouth of the Mekong River, managing to save only himself and the manuscript of his epic, holding it above water with one hand while the other was used to swim to shore. His rescue took months to occur, and he was taken to Malacca, where he received a new arrest warrant for misappropriating the assets of the dead that had been entrusted to him. He was taken to Goa once again, and luckily the viceroy was a longtime friend of his, pardoning his wrongdoings. During his time in Goa, he occupied with poetry and military activities, where he always showed bravery, readiness and loyalty to the Crown."
 epo_chain.17.a:0 "Mais do que prometia a força humana,"
 epo_chain.18.t:0 "Poverty in Sofala"
 epo_chain.18.d:0 "Missing his homeland, Camões embarked on Pedro Barreto's ship to Sofala, where Barreto had been appointed governor, and there Camões would wait for transport to Lisbon at a future date. However, Barreto was a treacherous man, making false promises to Camões. After two years in Sofala, he was found by acquaintance Diogo do Couto in a precarious state. His good friends gathered to pay for his trip to Lisboa, and so the poet would finally see his homeland again."
 epo_chain.18.a:0 "E entre gente remota edificaram"
 epo_chain.19.t:0 "Os Lusíadas"
 epo_chain.19.d:0 "After so many adventures, Camões finally completed Os Lusíadas, presenting them in recitation to [Root.Monarch.GetName]. The [Root.Monarch.GetTitle] ordered the work to be published, also granting a small pension to "Luís de Camões, noble knight of my House", in payment for services rendered in India. Os Lusíadas would become Portugal's national epic, and the greatest work of literature of the Portuguese language. In a tragic fate, the Epic ended up representing the end of Portuguese glory. Soon after it was released, the Portuguese crown fell under Spanish Habsburg rule. Poor decision-making and bad luck undermined the enormous potential that Portugal had to achieve even greater deeds. But this fate is not sealed, it is up to you to rewrite history and lead Portugal to a Glorious fate."
 epo_chain.19.a:0 "Novo Reino, que tanto sublimaram;"
