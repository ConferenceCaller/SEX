 #Mushasha
 BM_on_startup.2.t: "Muhammad ibn Falah the Mahdi"
 BM_on_startup.2.d: "Our spiritual and de-facto leader is Muhammad ibn Falah, a Wasit born theologian who studied in al-Hillah, who is yet so different to all of his peers. It was there, in Hillah, that he recognized that he is the embodiment of the prophesied representative of Imam Ali, the Mahdi. As such, in fervor of his grand quest to fulfill the prophecies, he founded the Musha'sha', an order where Mahdi's followers were to rid the world of evil. It has been a few yers since the founding of the order, and by Allah, we will fulfill our greater purpose."
 BM_on_startup.2.a: "Forever may he reign!"

 #MODIFIERS
 BM_mushasha_ibn_faluh_modifier: "Life of Ibn Falah"

 #SWEDEN
 BM_on_startup.3.t: "The Swedish Dilemma"
 BM_on_startup.3.d: "Sweden at the start of the 15th century was securely placed within the confines of the Kalmar Union, with the Danish Arch-King Christopher III as its formal regent. But to help with the management of the Kingdom of Sweden and Norway, both were informally managed by the "Lord regent", a head governor who was tasked with representing the interests of the Kalmar Union at the local level. In Norway this would be a succesful project and bring Norway and Denmark closer together, but in Sweden it would have the opposite effect. As the Lord Regent was intertwined with the interests of the Swedish nobles, who themselves grew more and more furious at Danish rule, the Lord Regent would often actively work against the Kalmar Union and the Danish Kings. \nNow, in the second half of the 15th century, the Lord Regent Bengt Jönsson Oxenstierna has ruled as regent of Sweden in Christopher III's stead during the conflict between Erik of Pommerania and Christopher III, and has been able to leverage a considerable amount of autonomous rule for Sweden. \nAs the threat of Swedish revolt grows bigger, Christopher III now ponders whether or not another Engelbrekt is around the corner, or even worse, outright rebellion of the entirety of Sweden itself."
 BM_on_startup.3.a: "We must not risk another costly war..."
 BM_on_startup.3.b: "Swedish independence? Unthinkable!"
 BM_on_startup_3_tt: "\n§Y*Sweden will remember this...§!\n"

 #MODIFIERS
 BM_dreams_of_independence: "Gathering Strength"
 BM_SWE_spirit_of_engelbrekt_mod: "Spirit of Engelbrekt"

 #ARDABIL
 BM_on_startup.4.t: "The Safavid Order"
 BM_on_startup.4.d: "In the mountains of Ardabil, the shiite turkmen tribes have united under the Safavid banner, a religious extremist order under the rule of Jafar 'the Righteous' Safavid. His skirmishes against the Shirvani Shahdom has increased tensions in the already chaotic region and the turkmen tribes are eager to be let loose in full-scale war against the Sunni Shirvani."
 BM_on_startup.4.a: "Rise of the Order!"

 #MODIFIERS
 BM_Jafar_Safavid_ruler_modifier: "Jafar 'the Righteous' Safavid"
 BM_safavid_order_modifier: "The Safavid Order"



 #AQ QOYUNLU
 BM_on_startup.5.t: "Ascension of Uzun Hasan"
 BM_on_startup.5.d: "Uzun 'the Tall' Hasan is a formidable warrior, a cunning diplomat, and considered the strongest and tallest out of all the Turkoman tribesmen. Being appointed by the 'Great Conqueror' Timur as governor of Diyarbekir and the surrounding regions, Uzun Hasan has built his powerbase and gained many sworn loyalties from the Turkoman tribes. With his ascension as the ruler of Aq Qoyunlu, Hasan now swears to fully unite the Turkomans under one banner."
 BM_on_startup.5.a: "Turn the tribesmen east, towards the 'Black Sheep'"


 cb_aq_ambition: "Aq Qoyunlu Ambition"
 cb_aq_ambition_desc: "It is time for the tribal feuds to cease. We will defeat our opponents and make sure no two lambs graze these lands."

 take_capital_cb_aq_ambition: "Aq Qoyunlu Ambition"
 take_capital_cb_aq_ambition_desc: "Take Capital [QAR.Capital.GetCapitalName]"
 CB_AQ_AMBITION: "War Goal is to the the capital province of Qara Qoyunly"

