 #BRANDENBURG
 BM_on_startup.6.t: "The Hohenzollern Brothers"
 BM_on_startup.6.d: "The Margraviate of Brandenburg is home to the House of Hohenzollern, a prestigious dynasty who's influence is dotted across the Holy Roman Empire. With the retirement of Friedrich I in 1437, his son, Friedrich II, has been ruling the Margraviate. In many ways Friedrich II, 'the Irontooth', has proven to be his father's son, resuming many of his policies. But he is not the only son nor the only one with experience of ruling Brandenburg. Friedrich II's brother Albrecht III, 'Achilles', has been ruling in the Franconian principalities since 1440 and is the heir to the throne of Brandenburg should Friedrich II retire or, god forbid, pass away. A third brother, Johann, 'the Alchemist', has also helped managed the governmental affairs in Brandenburg from 1424 though retiring early in 1425 to pursue alchemy, and also due to his administrative faults. \nNow, with the concentrating power in the hands of Friedrich II and his brothers, the Hohenzollern dynasty shall overcome its obstacles."
 BM_on_startup.6.a: "'Irontooth'? I like the sound of that."
 BM_irontooth_ruler_modifier: "Irontooth"
 desc_BM_irontooth_ruler_modifier: ""

 BM_on_startup.7.t: "The Passing of the Crown"
 BM_on_startup.7.d: "With Friedrich II no longer able to continue his reign of Brandenburg, the crown of the Margraviate must pass on to the next in line. Albrecht III is the clear successor to Friedrich II, but some argue that Johann deserves a second attempt of governance and that his ingenuity could be of use to Brandenburg."
 BM_on_startup.7.a: "Albrecht III will serve best!"
 BM_order_of_the_swan_knight_ruler_modifier: "'Order of the Swan'"
 desc_BM_order_of_the_swan_knight_ruler_modifier: ""

 BM_on_startup.7.b: "Johann deserves a second try"
 BM_johann_the_alchemist_ruler_modifier: "'Alchemist'"
 desc_BM_johann_the_alchemist_ruler_modifier: ""
 BM_johann_faulty_governance_ruler_modifier: "Faulty governance"
 desc_BM_johann_faulty_governance_ruler_modifier: ""

 BM_on_startup.7.c: "I think the current one is fine"




 #MAMLUKS
 BM_on_startup.8.t: "The Abbasid Caliphate"
 BM_on_startup.8.d: "The Abbasid Caliphate, influential from the 8th century to 13th century, was the third successive caliphate, based mostly in Baghdad. Unfortunately, after the sack of Baghdad in 1258 by the wretched Mongols, the prestige and authority of the Caliphate practically ceased to exist. In time, the Caliphate was recreated once more, this time in the Mamluk controlled Cairo in 1261. Altough the Caliph continued to formally hold ultimate religious authority, the Caliph was effectively held in permanent house-arrest with his influence reduced as an advisorly role pertaining to religious matters."

 BM_on_startup.8.a: "We are in control."
 BM_abbasid_caliph_triggered_province_modifier: "Abbasid Caliph"
 desc_BM_abbasid_caliph_triggered_province_modifier: ""
 BM_abbasid_caliph_triggered_province_modifier_TT: "Being Caliph allows us to enact £muslim_school_button£ §YIslamic Fatwas§! decisions \n \nBeing Caliph allows us to take the following Diplomatic Actions: \n§YDenounce Actions§! \n§YCall Jihad§! \n§YGive Praise§! \n \nIf any Non-Muslim country were to gain control of this province, the life of the Caliph could be in grave danger."


 #POLAND 
 BM_on_startup.9.t: "Defeat At Varna"
 BM_on_startup.9.d: "The battle of Varna has ended in a disaster for the Varna Crusaders. Not only has a total defeat been inflicted on the combined forces of our alliance, but King Władysław III who commanded the Christian armies has also been slain, leaving not only our kingdom but also the Hungarian kingdom without a king. The few returning men are battered and badly wounded and the late Władysławs most trusted advisors has been assembled to rule in an emergency Interregnum until a successor can be appointed."
 BM_on_startup.9.a: "Is this all that returned...?"

 BM_on_startup.10.t: "The Władysław Interregnum"
 BM_on_startup.10.d: "Now that an Interregnum has been declared and a provisionary council has been assembled, tasked with governing the Kingdom of Poland, the 'Interregnum Awaryjne' can begin to resolve domestic matters as well as prepare for changes in foreign diplomacy."
 BM_on_startup.10.a: "We should begin by stabilising the realm."

 BM_POL_emergency_interregnum: "Interregnum Awaryjne"
 desc_BM_POL_emergency_interregnum: ""

 cb_pol_ambition: "Prussian Confederation Conflict"
 cb_pol_ambition_desc: "The Teutonic Order has found itself facing a conspiracy of a organization known as the 'Prussian Confederation' that challenges Teutonic rule. The invitation of the Polish kingdom into this war threatens the very existence of the Teutonic Order."
 take_capital_cb_pol_ambition: "War of the Prussian Confederation"
 take_capital_cb_pol_ambition_desc: "The War Goal is to take Capital [DNZ.Capital.GetCapitalName]."


 # HORDE
 BM_on_startup.11.t: "The Great Troubles"
 BM_on_startup.11.d: "Ever since the fall of the Golden Horde, the disunity and crumble of the Yuan Empire, as well as the conquest of the Ilkhanate by Timurlane, many of the Mongol and Turkicized Khanates established in the 13th century has been subject to internal political disorder. This steady decline in power has been named the 'Great Troubles'. If the Hordes are ever able to continue their existence and keep to their traditions and nomadic ways, they must first overcome this challenge."
 BM_on_startup.11.a: "Maybe our nomadic ways are truly over?"
 BM_the_great_struggle: "Decline of the Hordes"
 desc_BM_the_great_struggle: ""



 #ARAGON
 BM_on_startup.12.t: "Reign of Alfons V"
 BM_on_startup.12.d: "The 'Magnanimous' King of Aragon, Alfonso V, has ruled over the Crown of Aragon for more than 3 decades. A capable and educated ruler as well as an early adopter of cannons as siege weapons, Alfons has managed to secure the Aragonese Crown as a strong presence across the western Mediterranean. With good relations in Bosnia, an ally to Skanderbeg's rebellion in Albania and leading diplomatic contacts with the Ethiopian Empire, Aragon remains a strong presence in the Eastern Mediterranean as well. Alfons wasn't only just a diplomat and strong militaristic ruler, he is considered by many to also be influential in the Renaissance movement in Italy, helping it spread to Iberia. However, with ailing health and age, it is not long before the most preeminent King of Aragon might pass, leaving the throne before the internal disputes of Aragon are solved."
 BM_on_startup.12.a: "Let us hope the last years of Alfons remain stable."






 BM_ARA_alfonso_artillery_arsenal: "Alfonso's Artillery Arsenal"
 desc_BM_ARA_alfonso_artillery_arsenal: ""