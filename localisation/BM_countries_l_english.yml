 EDI_ideas_start: "State of India Traditions"
 EDI_ideas_bonus: "State of India Ambition"


 SGF: "South German Federation"
 SGF_ADJ: "South German"
 SGF_annex_subects_effect_tt: "Annex all subject nations with their capital in the §YSouth Germany§! region."
 form_SGF_decision_title: "Unite the South Germans"
 form_SGF_decision_desc: "The South German Federation was initially a German alliance established to form a common defensive pact, but was transformed in the subsequent year into a federated state. The formation of the Federation proved to be an important milestone of German Unification, and it was the earliest continual legal predecessor of the modern German nation-state."


 SGF_ideas: "South German Ideas"
 SGF_ideas_start: "South German Traditions"
 SGF_ideas_bonus: "South German Ambitions"
 SGF_ideas_1: "Imperial Dynasties of Germany"
 SGF_ideas_1_desc: "Several dynasties that has ruled the Holy Roman Empire began as dukes in the south-german kingdoms. From the Habsburgs in Austria to the Hohenstaufens in Swabia who produced Barbarossa, the true King of Germany. It is clear that all of these families must unite behind a single nation-state of Germany."
 SGF_ideas_2: "Kaiserlicher Kriegsrat"
 SGF_ideas_2_desc: "To effectively coordinate the various levies, landsknechts, knights and hired mercenaries, it is clear that we must establish a council of military experts who can deal with the planning and organization of our forces. That way we will also be able to professionalize our soldiers into a true disciplined army."
 SGF_ideas_3: "Modernized Agriculture"
 SGF_ideas_3_desc: "Though the north german states are focusing on rapid industrialization, we in the south know that there is much to be gained by focusing on our agricultural sectors. Bavarian breweries and salt mines, Austrian winemaking, Swabian cloth and Franconian horses provide us with not only amenities for our people, but can be exported and sold across European markets for capital gains."
 SGF_ideas_4: "A United Banking Sector"
 SGF_ideas_4_desc: "Though the 'Fuggers' dominate the banks in most of southern germany, relying on the favor and approval of a single family with their own desires and ambitions could lead to economic disaster. We must establish a central bank that can make sure to refloat the economy should we be unable to pay our debts. By assimilating all local banking families and rich merchants into a single economic entity under our control, we can much better manage our economical assets."
 SGF_ideas_5: "Federalized Decentralization"
 SGF_ideas_5_desc: "Southern Germany has always had a culture of fiercly resisting foreigners and authoritarian Emperors. With leagues such as the Swabian Circle, the Swiss Cantons or the Bavarian Bands, we have learnt that it is better to allow some degrees of autonomy than to hopelessly suppress it. By granting each 'state' a position in our Reichsparlament we can distribute our administrative duties to the local parliaments to manage for us, reducing the strain on our Federation and also the cost."
 SGF_ideas_6: "Organized Free-Cities"
 SGF_ideas_6_desc: "The Free-Cities of Ulm, Nürnberg, Memmingen, Konstanz, Zürich, Frankfurt and others have become mercantile centers that bind Germany to the rest of Europe. By organizing the guilds, traders and bankers we can make our trade more efficient."
 SGF_ideas_7: "Conservativism"
 SGF_ideas_7_desc: "Reformation, Revolution, Progressiveness, all ideas that seek to radically alter society, but it is always at the cost of society itself. It is foolish to think that society can change rapidly without causing total collapse, unrest and the destruction of our christian values. Instead, we must step by step, slowly, and minutely make small changes towards change. It is better that we take things slowly than to rush, especially if it threatens the social order of society."


 NGF: "North German Confederation"
 NGF_ADJ: "North German"
 NGF_annex_subects_effect_tt: "Annex all subject nations with their capital in the §YNorth Germany§! region."
 form_NGF_decision_title: "Unite the North Germans"
 form_NGF_decision_desc: "The North German Confederation was initially a German alliance established to form a common defensive pact, but was transformed in the subsequent year into a confederated state, and a de facto federal state. The formation of the Confederation proved to be an important milestone of German Unification, and it was the earliest continual legal predecessor of the modern German nation-state."

 NGF_idea_4: "Religious Tolerance"
 NGF_idea_4_desc: "The uniting of the German peoples under one single nation-state has begun in the northern portions of the Fatherland, much of which has broken with the Catholic Church. However, with our subsequent pushes south to unite the Germanic people, we must accept the reality that our southern brethren still cling to Catholicism. By embracing tolerance and religious freedoms of practice we will have an easier time to incorporate southern Germany."
 NGF_idea_1: "Expansion of the Realm"
 NGF_idea_1_desc: "The conquest of Northern Germany is only the first step towards a united German state. Through diplomatic pens or our thundering guns we shall grow our Confederation."
 NGF_ideas: "North German Ideas"
 NGF_ideas_start: "North German Traditions"
 NGF_ideas_bonus: "North German Ambitions"
 NGF_german_confederation: "German Confederation"
 NGF_german_confederation_desc: "With the North German lands now unified, we have found that we have more in common with each other than what divide us. We can use this to ensure peace and stability in our realm."


 DAC: "Dacia"
 DAC_ADJ: "Dacian"

 BM_reformed_the_dacian_kingdom: "Reformed Dacian Kingdom"
 desc_BM_reformed_the_dacian_kingdom: ""



 KOG_ideas: "Kingdom of God Ideas"
 KOG_ideas_start: "Kingdom of God Traditions"
 KOG_ideas_bonus: "Kingdom of God Ambitions"
 KOG_ideas_1: "Apostolicae Servitutis"
 KOG_ideas_1_desc: "The Curia Treasury must remain under our firm control and all of Catholic Europe will donate their worldly possessions to Rome."
 KOG_ideas_2: "God's Holy Warriors"
 KOG_ideas_2_desc: "The Soldiers of Christ have proven themselves loyal and pious, thousands will flock to our Crusader Banners as we inflict salvation on the unbelievers. Deus Vult!"
 KOG_ideas_3: "Dei Gratia Rex"
 KOG_ideas_3_desc: "God has ultimately selected our ruler to rule by His Grace and His Word. Therefore wherever we establish His Rule, the people must also follow His Word."
 KOG_ideas_4: "Glory of Rome"
 KOG_ideas_4_desc: "We control not only the great city of the ancient Romans, but also the entire Italian peninsula, clearly denoting us as the successors of Rome itself. We shall construct a Kingdom worthy its glory as we establish our wonders and build our cities."
 KOG_ideas_5: "Blessed Cannons"
 KOG_ideas_5_desc: "The cannons of Rome and the Kingdom of God shall be feared as truthsayers who blast the heretical teachings to dust. For it is our rightful truth that will bring down walls and bring fire to people!"
 KOG_ideas_6: "Centralize the States"
 KOG_ideas_6_desc: "We will consolidate our power in Papal provinces by seizing it from the local princes."
 KOG_ideas_7: "The Vatican Museums"
 KOG_ideas_7_desc: "Years of collecting and donations have made Vatican City the home of many museums. We've accumulated one of the most impressive art collections in history."

 SYR_ideas: "Syrian Ideas"
 SYR_ideas_start: "Syrian Traditions"
 SYR_ideas_bonus: "Syrian Ambitions"
 SYR_ideas_1: "The one Wanted By Many"
 SYR_ideas_1_desc: "It is a fate that the people of Syria did not choose, but rather one that was thrust upon the people and the region itself. A blessing and a curse to be at such a vital point of interest between the Christians and Muslims as well as rival political powers, Syria has been split apart and conquered by so many in the past. Even today there are several states that want to see us annexed into their realm, yet there are others that are willing to be courteous with us and even recognize the great history we have."
 SYR_ideas_2: "The Illustrious Past Renewed"
 SYR_ideas_2_desc: "From the likes of Dimasq to Halab and several others, these old centers of learning and culture that have been integral to the region of the Middle East will become the bedrock for a righteous and educated Syrian state."
 SYR_ideas_3: "Between the Cross and the Crescent"
 SYR_ideas_3_desc: "The history of how Christians and Muslims fought for control of Syrian land is known to just about every single ruler and noble in the region. Such bloody battle and pivotal shifts in political power over the course of the 1000's and 1200's ensured that Syria itself would always be in the line-of-fire for surrounding powers. Yet, it is amidst this storm of politics that several communities learned to come to terms with outsiders. It is that notion of tolerance that we should foster since there will be no shortage of varied people coming through our land for any number of reasons."
 SYR_ideas_4: "Cannon Fortifications"
 SYR_ideas_4_desc: "Old fortifications are scattered all across Syria, but these have stood robust against the test of time again and again. Whilst today, their armouries and defensive fortifications are outdated and dilapitated, all that is required to transform them into modern forts is simple cannons. It matters not whether we face Muslims or Christians, our refined modern forts can withstand cannons and mortars regardless."
 SYR_ideas_5: "Arid Logistics"
 SYR_ideas_5_desc: "Supplies along the coast of the Mediterranean Sea are much easier to handle compared to the arid stretches of land that are between the coast and the rivers of the Mashriq. That is where the postal services of the old Mamluk Sultanate come into play. Through revamping the roads that are used between towns and cities, we can ensure logistics and couriers are going back and forth across the realm are safe and knowe exactly where to go instead of getting lost, costing us precious time and resources."
 SYR_ideas_6: "Potential In Syria"
 SYR_ideas_6_desc: "An independent Syrian state has never truly been realized in these past few centuries for a variety of reasons. Some would pry pieces of our lovely region apart for their own desires, leading to different cultures and religions becoming intertwined within the constantly unfolding story of Syria, but this has not stopped the people of the region from eventually uniting under one banner. Now that there is a cogent state for and by the Syrian people, it is finally time to work toward internal growth instead of constant external vigilance."
 SYR_ideas_7: "Adapting to the Climate"
 SYR_ideas_7_desc: "Whilst the coast may enjoy a much more temperature environment to live in, we cannot say the same for our communities on their interior that get sweltering weeks and months of heat in comparison. What this has done for our soldiers, however, is ensure that they know how to prepare for a variety of environmental conditions and climate variations when marching throughout enemy territory or even our own."